<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=950, initial-scale=1.0" />
    <title>Billing Baba Checkout</title>
    <style>
      /* Opaque white — NOT transparent. WKWebView on macOS shows grey through transparent. */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #ffffff;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="checkout-container"
      style="width: 100%; height: 100%; position: absolute; top: 0; left: 0"
    ></div>
    <script>
      var CHECKOUT_SCRIPT_URL = "https://checkout.razorpay.com/v1/checkout.js";
      var MIN_DESKTOP_WIDTH = 768;
      var checkoutScriptPromise = null;

      function postToFlutter(event, data) {
        var message = JSON.stringify({ event: event, data: data || {} });
        if (window.PaymentBridge && window.PaymentBridge.postMessage) {
          window.PaymentBridge.postMessage(message);
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      /* Step 1 — environment metrics before Razorpay.open() */
      function collectEnvironmentMetrics(stage) {
        var metrics = {
          stage: stage,
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          outerWidth: window.outerWidth,
          outerHeight: window.outerHeight,
          screenWidth: screen.width,
          screenHeight: screen.height,
          availWidth: screen.availWidth,
          availHeight: screen.availHeight,
          devicePixelRatio: window.devicePixelRatio,
          userAgent: navigator.userAgent,
          platform: navigator.platform,
          maxTouchPoints: navigator.maxTouchPoints,
          pointerFine: window.matchMedia("(pointer: fine)").matches,
          pointerCoarse: window.matchMedia("(pointer: coarse)").matches,
          hover: window.matchMedia("(hover: hover)").matches,
          hoverNone: window.matchMedia("(hover: none)").matches,
          mobileMedia: window.matchMedia("(max-width: 768px)").matches,
          maxDeviceWidth485: window.matchMedia("(max-device-width: 485px)")
            .matches,
          maxDeviceHeight485: window.matchMedia("(max-device-height: 485px)")
            .matches,
          documentWidth: document.documentElement.clientWidth,
          documentHeight: document.documentElement.clientHeight,
          locationHref: window.location.href,
        };

        console.log("[checkout] environment @" + stage);
        console.table(metrics);
        postToFlutter("checkout_environment", metrics);
        return metrics;
      }

      /* Step 2 — inspect ancestor element computed styles */
      function inspectElementStyles(el, label) {
        if (!el) {
          return { label: label, exists: false };
        }
        var cs = window.getComputedStyle(el);
        var rect = el.getBoundingClientRect();
        return {
          label: label,
          tag: el.tagName,
          id: el.id || null,
          className: el.className || null,
          background: cs.background,
          backgroundColor: cs.backgroundColor,
          opacity: cs.opacity,
          display: cs.display,
          position: cs.position,
          width: cs.width,
          height: cs.height,
          overflow: cs.overflow,
          rectWidth: Math.round(rect.width),
          rectHeight: Math.round(rect.height),
        };
      }

      function inspectDomTree(stage) {
        var razorpaySelectors = [
          ".razorpay-container",
          ".razorpay-backdrop",
          ".razorpay-modal",
          ".razorpay-modal-body",
          "iframe",
        ];

        var ancestors = [
          inspectElementStyles(document.documentElement, "html"),
          inspectElementStyles(document.body, "body"),
          inspectElementStyles(
            document.getElementById("checkout-container"),
            "#checkout-container"
          ),
          inspectElementStyles(document.getElementById("root"), "#root"),
        ];

        var razorpayNodes = [];
        razorpaySelectors.forEach(function (selector) {
          var nodes = document.querySelectorAll(selector);
          for (var i = 0; i < nodes.length; i++) {
            razorpayNodes.push(
              inspectElementStyles(nodes[i], selector + "[" + i + "]")
            );
          }
        });

        var report = {
          stage: stage,
          ancestors: ancestors,
          razorpayNodes: razorpayNodes,
          bodyChildCount: document.body ? document.body.children.length : 0,
        };

        console.log("[checkout] DOM inspection @" + stage, report);
        postToFlutter("dom_inspection", report);
        return report;
      }

      /* Razorpay mobile detection mirror (from checkout.js source) */
      function razorpayWouldDetectMobile() {
        var innerSmall = window.innerWidth && window.innerWidth < 485;
        var isIPhone = /iPhone/.test(navigator.userAgent);
        var deviceSmall =
          window.matchMedia("(max-device-height: 485px)").matches ||
          window.matchMedia("(max-device-width: 485px)").matches;
        return {
          wouldBeMobile: innerSmall || isIPhone || deviceSmall,
          innerWidthLt485: innerSmall,
          isIPhone: isIPhone,
          deviceDimensionLt485: deviceSmall,
        };
      }

      function waitForDesktopLayout() {
        return new Promise(function (resolve) {
          if (window.innerWidth >= MIN_DESKTOP_WIDTH) {
            resolve();
            return;
          }

          var timeout = setTimeout(function () {
            window.removeEventListener("resize", onResize);
            resolve();
          }, 5000);

          function onResize() {
            if (window.innerWidth >= MIN_DESKTOP_WIDTH) {
              clearTimeout(timeout);
              window.removeEventListener("resize", onResize);
              resolve();
            }
          }

          window.addEventListener("resize", onResize);
        });
      }

      function loadCheckoutScript() {
        if (window.Razorpay) {
          return Promise.resolve();
        }
        if (checkoutScriptPromise) {
          return checkoutScriptPromise;
        }

        checkoutScriptPromise = new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = CHECKOUT_SCRIPT_URL;
          script.async = true;
          script.onload = function () {
            collectEnvironmentMetrics("after_checkout_js_load");
            postToFlutter("razorpay_mobile_detection", {
              stage: "after_checkout_js_load",
              detection: razorpayWouldDetectMobile(),
            });
            resolve();
          };
          script.onerror = function () {
            reject(new Error("Failed to load Razorpay checkout.js"));
          };
          document.head.appendChild(script);
        });

        return checkoutScriptPromise;
      }

      function openCheckout(config) {
        collectEnvironmentMetrics("before_open");
        postToFlutter("razorpay_mobile_detection", {
          stage: "before_open",
          detection: razorpayWouldDetectMobile(),
        });
        inspectDomTree("before_open");

        var options = {
          key: config.key,
          order_id: config.orderId,
          amount: config.amount,
          currency: config.currency,
          name: config.businessName,
          description: config.description,
          image: config.businessLogo || undefined,
          theme: { color: config.themeColor },
          prefill: {
            name: config.customerName,
            email: config.customerEmail,
            contact: config.customerPhone,
          },
          /* Embedded mode: fills #checkout-container instead of modal overlay */
          parent: "#checkout-container",
          modal: {
            ondismiss: function () {
              postToFlutter("payment_cancelled");
            },
            onhidden: function () {
              postToFlutter("payment_modal_hidden");
            },
          },
          handler: function (response) {
            postToFlutter("payment_success", {
              source: "handler",
              razorpayPaymentId: response.razorpay_payment_id,
              razorpayOrderId: response.razorpay_order_id,
              razorpaySignature: response.razorpay_signature,
            });
          },
        };

        var rzp = new Razorpay(options);

        rzp.on("payment.success", function (response) {
          postToFlutter("payment_success", {
            source: "payment.success_event",
            razorpayPaymentId: response.razorpay_payment_id,
            razorpayOrderId: response.razorpay_order_id,
            razorpaySignature: response.razorpay_signature,
          });
        });

        rzp.on("payment.failed", function (response) {
          postToFlutter("payment_failed", {
            source: "payment.failed_event",
            message: response.error && response.error.description,
          });
        });

        postToFlutter("payment_started");
        rzp.open();

        /* Step 3 — inspect DOM 1s after Razorpay initializes */
        setTimeout(function () {
          collectEnvironmentMetrics("after_open_1s");
          postToFlutter("razorpay_mobile_detection", {
            stage: "after_open_1s",
            detection: razorpayWouldDetectMobile(),
          });
          inspectDomTree("after_open_1s");
        }, 1000);
      }

      window.BillingBabaCheckout = {
        start: function (config) {
          collectEnvironmentMetrics("before_script_load");
          inspectDomTree("before_script_load");

          waitForDesktopLayout()
            .then(function () {
              return loadCheckoutScript();
            })
            .then(function () {
              openCheckout(config);
            })
            .catch(function (error) {
              postToFlutter("payment_failed", {
                message:
                  (error && error.message) ||
                  "Failed to start checkout. Please try again.",
              });
            });
        },
      };
    </script>
  </body>
</html>
