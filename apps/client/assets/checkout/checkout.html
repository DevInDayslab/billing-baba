<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Billing Baba Checkout</title>
    <style>
      /*
       * Full-window transparent page. Flutter paints the dimmed barrier.
       * Razorpay Standard Checkout (modal, no `parent`) draws the desktop
       * two-column window. Its own backdrop is suppressed so it doesn't
       * cover the Flutter scrim with an opaque layer.
       */
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: transparent !important;
        overflow: hidden;
      }

      .razorpay-backdrop {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
        pointer-events: none !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <script>
      var CHECKOUT_SCRIPT_URL = "https://checkout.razorpay.com/v1/checkout.js";
      var checkoutScriptPromise = null;

      function postToFlutter(event, data) {
        var message = JSON.stringify({ event: event, data: data || {} });
        if (
          window.flutter_inappwebview &&
          window.flutter_inappwebview.callHandler
        ) {
          window.flutter_inappwebview.callHandler("PaymentBridge", message);
        } else if (window.PaymentBridge && window.PaymentBridge.postMessage) {
          window.PaymentBridge.postMessage(message);
        } else if (window.chrome && window.chrome.webview) {
          window.chrome.webview.postMessage(message);
        }
      }

      /**
       * Razorpay checkout.js treats these as mobile. Force desktop answers
       * before checkout.js evaluates them (WebView sometimes reports touch /
       * coarse pointer even on macOS).
       */
      function forceDesktopEnvironment() {
        try {
          Object.defineProperty(navigator, "maxTouchPoints", {
            get: function () {
              return 0;
            },
            configurable: true,
          });
        } catch (e) {}

        var originalMatchMedia = window.matchMedia.bind(window);
        window.matchMedia = function (query) {
          var q = String(query).toLowerCase();
          if (
            q.indexOf("max-device-width") !== -1 ||
            q.indexOf("max-device-height") !== -1 ||
            q.indexOf("pointer: coarse") !== -1 ||
            q.indexOf("hover: none") !== -1 ||
            q.indexOf("max-width: 485") !== -1 ||
            q.indexOf("max-width:485") !== -1
          ) {
            return {
              matches: false,
              media: query,
              onchange: null,
              addListener: function () {},
              removeListener: function () {},
              addEventListener: function () {},
              removeEventListener: function () {},
              dispatchEvent: function () {
                return false;
              },
            };
          }
          if (
            q.indexOf("pointer: fine") !== -1 ||
            q.indexOf("hover: hover") !== -1
          ) {
            var fine = originalMatchMedia(query);
            return {
              matches: true,
              media: query,
              onchange: null,
              addListener: fine.addListener
                ? fine.addListener.bind(fine)
                : function () {},
              removeListener: fine.removeListener
                ? fine.removeListener.bind(fine)
                : function () {},
              addEventListener: fine.addEventListener
                ? fine.addEventListener.bind(fine)
                : function () {},
              removeEventListener: fine.removeEventListener
                ? fine.removeEventListener.bind(fine)
                : function () {},
              dispatchEvent: function () {
                return false;
              },
            };
          }
          return originalMatchMedia(query);
        };
      }

      function suppressRazorpayBackdrop() {
        var nodes = document.querySelectorAll(
          ".razorpay-backdrop, .razorpay-container > .razorpay-backdrop"
        );
        for (var i = 0; i < nodes.length; i++) {
          nodes[i].style.setProperty("display", "none", "important");
          nodes[i].style.setProperty("opacity", "0", "important");
          nodes[i].style.setProperty("visibility", "hidden", "important");
          nodes[i].style.setProperty("background", "transparent", "important");
        }
      }

      function watchAndSuppressBackdrop() {
        suppressRazorpayBackdrop();
        if (!window.MutationObserver || !document.body) return;
        var observer = new MutationObserver(function () {
          suppressRazorpayBackdrop();
        });
        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });
      }

      function collectEnvironmentMetrics(stage) {
        var metrics = {
          stage: stage,
          innerWidth: window.innerWidth,
          innerHeight: window.innerHeight,
          documentWidth: document.documentElement.clientWidth,
          documentHeight: document.documentElement.clientHeight,
          userAgent: navigator.userAgent,
          maxTouchPoints: navigator.maxTouchPoints,
          pointerCoarse: window.matchMedia("(pointer: coarse)").matches,
          maxDeviceWidth485: window.matchMedia("(max-device-width: 485px)")
            .matches,
        };
        console.log("[checkout] environment @" + stage, metrics);
        postToFlutter("checkout_environment", metrics);
        return metrics;
      }

      function loadCheckoutScript() {
        if (window.Razorpay) {
          return Promise.resolve();
        }
        if (checkoutScriptPromise) {
          return checkoutScriptPromise;
        }

        checkoutScriptPromise = new Promise(function (resolve, reject) {
          var script = document.createElement("script");
          script.src = CHECKOUT_SCRIPT_URL;
          script.async = true;
          script.onload = function () {
            collectEnvironmentMetrics("after_checkout_js_load");
            resolve();
          };
          script.onerror = function () {
            reject(new Error("Failed to load Razorpay checkout.js"));
          };
          document.head.appendChild(script);
        });

        return checkoutScriptPromise;
      }

      function openCheckout(config) {
        collectEnvironmentMetrics("before_open");

        var options = {
          key: config.key,
          order_id: config.orderId,
          amount: config.amount,
          currency: config.currency,
          name: config.businessName,
          description: config.description,
          image: config.businessLogo || undefined,
          theme: { color: config.themeColor },
          prefill: {
            name: config.customerName,
            email: config.customerEmail,
            contact: config.customerPhone,
          },
          /* NO `parent` — parent embed uses compact/mobile UI even at 960px. */
          modal: {
            ondismiss: function () {
              postToFlutter("payment_cancelled");
            },
            onhidden: function () {
              postToFlutter("payment_modal_hidden");
            },
          },
          handler: function (response) {
            postToFlutter("payment_success", {
              source: "handler",
              razorpayPaymentId: response.razorpay_payment_id,
              razorpayOrderId: response.razorpay_order_id,
              razorpaySignature: response.razorpay_signature,
            });
          },
        };

        var rzp = new Razorpay(options);

        rzp.on("payment.success", function (response) {
          postToFlutter("payment_success", {
            source: "payment.success_event",
            razorpayPaymentId: response.razorpay_payment_id,
            razorpayOrderId: response.razorpay_order_id,
            razorpaySignature: response.razorpay_signature,
          });
        });

        rzp.on("payment.failed", function (response) {
          postToFlutter("payment_failed", {
            source: "payment.failed_event",
            message: response.error && response.error.description,
          });
        });

        postToFlutter("payment_started");
        rzp.open();
        watchAndSuppressBackdrop();
        setTimeout(suppressRazorpayBackdrop, 50);
        setTimeout(suppressRazorpayBackdrop, 300);
        setTimeout(suppressRazorpayBackdrop, 1000);
      }

      window.BillingBabaCheckout = {
        start: function (config) {
          forceDesktopEnvironment();
          collectEnvironmentMetrics("before_script_load");

          // Wait one frame so the full-window WebView has committed its size
          // before checkout.js snapshots innerWidth.
          requestAnimationFrame(function () {
            requestAnimationFrame(function () {
              loadCheckoutScript()
                .then(function () {
                  openCheckout(config);
                })
                .catch(function (error) {
                  postToFlutter("payment_failed", {
                    message:
                      (error && error.message) ||
                      "Failed to start checkout. Please try again.",
                  });
                });
            });
          });
        },
      };
    </script>
  </body>
</html>
