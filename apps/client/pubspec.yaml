name: billing_baba
description: Offline-first POS, billing, and business management for Indian retailers.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Routing
  go_router: ^17.3.0

  # Networking
  dio: ^5.9.2

  # Database
  drift: ^2.34.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.3
  collection: ^1.19.1
  path_provider: ^2.1.5
  path: ^1.9.1
  archive: ^4.0.7
  crypto: ^3.0.6
  connectivity_plus: ^7.2.0
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^10.2.0
  device_info_plus: ^13.2.0

  # UI
  google_fonts: ^8.1.0
  flutter_svg: ^2.2.4
  gap: ^3.0.1
  flex_color_scheme: ^8.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  visibility_detector: ^0.4.0+2
  shimmer: ^3.0.0
  sendotp_flutter_sdk: ^0.0.2
  flutter_dotenv: ^6.0.1
  lucide_icons_flutter: ^3.1.14+2
  fl_chart: ^1.2.0

  # Print / PDF
  pdf: ^3.11.3
  printing: ^5.14.3
  barcode: ^2.2.9
  share_plus: ^13.2.0
  url_launcher: ^6.3.1

  # Export
  csv: ^6.0.0
  file_picker: ^12.0.0-beta.7
  justkawal_excel_updated: ^5.0.0
  tabler_icons_plus: ^3.44.0
  flutter_launcher_icons: ^0.14.4
  font_awesome_flutter: ^11.0.0
  window_manager: ^0.5.2
  open_filex: ^4.7.0

  # Desktop Razorpay checkout (InAppWebView host + netbanking popups).
  flutter_inappwebview: ^6.1.5
  win32: ^6.3.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  drift_dev: ^2.34.0

  # Linting
  very_good_analysis: ^10.3.0
  # custom_lint and riverpod_lint omitted: custom_lint 0.8.x pins analyzer ^8,
  # which conflicts with Riverpod 3.2.1+ / drift_dev / json_serializable codegen.
  # Re-add when custom_lint supports analyzer 10+.

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/fonts/
    - assets/icons/
    - assets/images/
    - assets/illustrations/
    - assets/animations/
    - .env

# Flutter Launcher Icons
flutter_launcher_icons:
  image_path: assets/images/logo.png

  android: true
  ios: true

  macos:
    generate: true
  windows:
    generate: true

  remove_alpha_ios: true
