name: Setup Flutter environment
description: Generate and validate apps/client .env from workflow inputs.

inputs:
  working-directory:
    description: Flutter app directory relative to the repository root.
    required: false
    default: apps/client
  app_env:
    description: APP_ENV value for the Flutter client.
    required: true
  debug:
    description: DEBUG value for the Flutter client.
    required: true
  enable_dev_login:
    description: ENABLE_DEV_LOGIN value for the Flutter client.
    required: true
  dev_otp:
    description: DEV_OTP value for the Flutter client.
    required: true
  api_base_url:
    description: API_BASE_URL value for the Flutter client.
    required: true
  msg91_widget_id:
    description: MSG91_WIDGET_ID value for the Flutter client.
    required: true
  msg91_widget_auth_token:
    description: MSG91_WIDGET_AUTH_TOKEN value for the Flutter client.
    required: true

runs:
  using: composite
  steps:
    - name: Generate Flutter .env
      shell: bash
      run: |
        set -euo pipefail
        export FLUTTER_ENV_DIR='${{ inputs.working-directory }}'
        export APP_ENV='${{ inputs.app_env }}'
        export DEBUG='${{ inputs.debug }}'
        export ENABLE_DEV_LOGIN='${{ inputs.enable_dev_login }}'
        export DEV_OTP='${{ inputs.dev_otp }}'
        export API_BASE_URL='${{ inputs.api_base_url }}'
        export MSG91_WIDGET_ID='${{ inputs.msg91_widget_id }}'
        export MSG91_WIDGET_AUTH_TOKEN='${{ inputs.msg91_widget_auth_token }}'
        bash "${{ github.action_path }}/../../scripts/setup-flutter-env.sh"
