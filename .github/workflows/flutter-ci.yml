# Flutter CI for Billing Baba client.
# Runs on pull requests and pushes targeting `develop`.
#
# Does not build desktop binaries — desktop builds run only in the release workflow.

name: Flutter CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_WORKING_DIRECTORY: apps/client

jobs:
  ci:
    name: Format, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Flutter .env
        uses: ./.github/actions/setup-flutter-env
        with:
          app_env: ${{ vars.APP_ENV }}
          debug: ${{ vars.DEBUG }}
          enable_dev_login: ${{ vars.ENABLE_DEV_LOGIN }}
          dev_otp: ${{ vars.DEV_OTP }}
          api_base_url: ${{ vars.API_BASE_URL }}
          msg91_widget_id: ${{ vars.MSG91_WIDGET_ID }}
          msg91_widget_auth_token: ${{ secrets.MSG91_WIDGET_AUTH_TOKEN }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
