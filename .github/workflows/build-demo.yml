# Internal alpha/demo desktop builds for Billing Baba.
# Produces an unsigned Windows Release zip — no signing, notarization, or publishing.
#
# Triggers:
#   - Manual run (workflow_dispatch) — builds the branch you select in the UI
#   - Push to the `demo` branch
#
# Demo config uses repository variables and secrets (see flutter-ci.yml).
# Written via setup-flutter-env.sh to avoid PowerShell UTF-8 BOM issues with dotenv.

name: Build Demo

on:
  workflow_dispatch:
  push:
    branches:
      - demo

env:
  FLUTTER_WORKING_DIRECTORY: apps/client

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    defaults:
      run:
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

    steps:
      # Checkout the commit that triggered this run (push ref or dispatch branch).
      # Do not hardcode `ref: demo` — that branch may not exist on the remote.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate Flutter .env
        working-directory: .
        env:
          FLUTTER_ENV_DIR: apps/client
          APP_ENV: ${{ vars.APP_ENV }}
          DEBUG: ${{ vars.DEBUG }}
          ENABLE_DEV_LOGIN: ${{ vars.ENABLE_DEV_LOGIN }}
          DEV_OTP: ${{ vars.DEV_OTP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_URL: https://billingbaba.com
          MSG91_WIDGET_ID: ${{ secrets.MSG91_WIDGET_ID }}
          MSG91_WIDGET_AUTH_TOKEN: ${{ secrets.MSG91_WIDGET_AUTH_TOKEN }}
        run: bash .github/scripts/setup-flutter-env.sh

      - name: Set up Flutter (stable, with SDK + pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Clean and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=API_BASE_URL=$env:API_BASE_URL
          --dart-define=WEBSITE_URL=https://billingbaba.com

      - name: Verify build output and package artifact
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $exePath = Join-Path $releaseDir "billing_baba.exe"

          Write-Host "Build output directory: $(Resolve-Path $releaseDir)"

          if (-not (Test-Path $exePath)) {
            Write-Error "Build output missing: expected executable at '$exePath'"
            exit 1
          }

          Write-Host "Verified executable: $exePath"

          # Zip the full Release folder (exe, DLLs, data/, and runtime deps) — not just the .exe.
          $zipPath = Join-Path $PWD "BillingBaba-Windows.zip"
          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force
          Write-Host "Created artifact: $zipPath"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillingBaba-Windows
          path: ${{ env.FLUTTER_WORKING_DIRECTORY }}/BillingBaba-Windows.zip
          retention-days: 30
