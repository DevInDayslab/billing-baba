# Windows desktop release pipeline for Billing Baba.
#
# Produces:
#   - BillingBabaSetup-v<version>.exe  (Inno Setup installer with VC++ runtime)
#   - BillingBaba-Windows-v<version>.zip
#   - SHA256SUMS.txt
#
# Triggers:
#   - Push to `demo` branch → prerelease "Demo Build" on GitHub Releases
#   - Push of version tag `v*` → GitHub Release with auto-generated notes
#   - Manual workflow_dispatch
#
# Demo config uses repository variables and secrets (see flutter-ci.yml).
# Written via setup-flutter-env.sh to avoid PowerShell UTF-8 BOM issues with dotenv.
#
# Future placeholders (not implemented):
#   - Windows Authenticode signing (SignTool / certificate)
#   - Auto-updater (e.g. winsparkle, custom delta updates)
#   - MSIX packaging for Microsoft Store distribution

name: Build Demo

on:
  workflow_dispatch:
  push:
    branches:
      - demo
      - develop
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_WORKING_DIRECTORY: apps/client
  VC_REDIST_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe
  VC_REDIST_CACHE_KEY: vc-redist-x64-v17

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    defaults:
      run:
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

    steps:
      # ── Checkout & environment ──────────────────────────────────────────────

      # Checkout the commit that triggered this run (push ref or dispatch branch).
      # Do not hardcode `ref: demo` — that branch may not exist on the remote.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          if (-not $line) {
            Write-Error "Could not find version in pubspec.yaml"
            exit 1
          }
          $version = ($line.Line -replace 'version:\s*', '').Trim().Split('+')[0]
          Write-Host "Application version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Determine release metadata
        id: release
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          $version = "${{ steps.version.outputs.version }}"

          $isTagRelease = $ref -match '^refs/tags/v'
          $isDemoBranch = $ref -eq 'refs/heads/demo'
          $publishRelease = $isTagRelease -or $isDemoBranch

          if ($isTagRelease) {
            $tag = $ref.Replace('refs/tags/', '')
            $releaseName = "Billing Baba $version"
            $prerelease = 'false'
          } elseif ($isDemoBranch) {
            $tag = 'demo-build'
            $releaseName = 'Demo Build'
            $prerelease = 'true'
          } else {
            $tag = ''
            $releaseName = ''
            $prerelease = 'false'
          }

          "publish_release=$($publishRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "is_tag_release=$($isTagRelease.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_name=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$prerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

          Write-Host "Publish release: $publishRelease"
          Write-Host "Release tag: $tag"
          Write-Host "Release name: $releaseName"

      - name: Generate Flutter .env
        working-directory: .
        env:
          FLUTTER_ENV_DIR: apps/client
          APP_ENV: ${{ vars.APP_ENV }}
          DEBUG: ${{ vars.DEBUG }}
          ENABLE_DEV_LOGIN: ${{ vars.ENABLE_DEV_LOGIN }}
          DEV_OTP: ${{ vars.DEV_OTP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_URL: https://billingbaba.com
          MSG91_WIDGET_ID: ${{ secrets.MSG91_WIDGET_ID }}
          MSG91_WIDGET_AUTH_TOKEN: ${{ secrets.MSG91_WIDGET_AUTH_TOKEN }}
        run: bash .github/scripts/setup-flutter-env.sh

      # ── Flutter build ─────────────────────────────────────────────────────────

      - name: Set up Flutter (stable, with SDK + pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Clean and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Windows release
        run: >
          flutter build windows --release
          --dart-define=API_BASE_URL=$env:API_BASE_URL
          --dart-define=WEBSITE_URL=https://billingbaba.com

      # ── Verify build output ───────────────────────────────────────────────────

      - name: Verify Windows release build output
        id: build_output
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "build/windows/x64/runner/Release"
          $exePath = Join-Path $releaseDir "billing_baba.exe"

          Write-Host "Build output directory: $releaseDir"

          if (-not (Test-Path $exePath)) {
            Write-Error "Build output missing: expected executable at '$exePath'"
            exit 1
          }

          Write-Host "Verified executable: $exePath"
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── VC++ Redistributable ──────────────────────────────────────────────────

      - name: Restore VC++ Redistributable cache
        id: vc_redist_cache
        uses: actions/cache@v4
        with:
          path: installer/deps
          key: ${{ env.VC_REDIST_CACHE_KEY }}

      - name: Download VC++ Redistributable
        if: steps.vc_redist_cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force -Path installer/deps | Out-Null
          Invoke-WebRequest -Uri "${{ env.VC_REDIST_URL }}" -OutFile installer/deps/vc_redist.x64.exe
          Write-Host "Downloaded VC++ Redistributable to installer/deps/vc_redist.x64.exe"

      - name: Verify VC++ Redistributable
        shell: pwsh
        working-directory: .
        run: |
          $vcRedist = "installer/deps/vc_redist.x64.exe"
          if (-not (Test-Path $vcRedist)) {
            Write-Error "VC++ Redistributable missing at '$vcRedist'"
            exit 1
          }
          Write-Host "Verified VC++ Redistributable: $vcRedist"

      # ── Inno Setup installer ──────────────────────────────────────────────────

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found at '$iscc'"
            exit 1
          }
          Write-Host "Inno Setup installed: $iscc"

      - name: Compile Inno Setup installer
        id: installer
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $releaseDir = "${{ steps.build_output.outputs.release_dir }}"
          $outputDir = Join-Path $PWD "dist"
          $vcRedist = Join-Path $PWD "installer/deps/vc_redist.x64.exe"
          $setupIcon = Join-Path $PWD "apps/client/windows/runner/resources/app_icon.ico"
          $issFile = Join-Path $PWD "installer/BillingBaba.iss"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          & $iscc `
            "/DAppVersion=$version" `
            "/DReleaseDir=$releaseDir" `
            "/DOutputDir=$outputDir" `
            "/DVCRedistPath=$vcRedist" `
            "/DSetupIcon=$setupIcon" `
            $issFile

          $setupExe = Join-Path $outputDir "BillingBabaSetup-v$version.exe"
          if (-not (Test-Path $setupExe)) {
            Write-Error "Installer output missing: expected '$setupExe'"
            exit 1
          }

          Write-Host "Created installer: $setupExe"
          "setup_exe=$setupExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── Portable ZIP package ──────────────────────────────────────────────────

      - name: Package portable Windows ZIP
        id: zip
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $releaseDir = "build/windows/x64/runner/Release"
          $zipName = "BillingBaba-Windows-v$version.zip"
          $zipPath = Join-Path $PWD $zipName

          if (Test-Path $zipPath) {
            Remove-Item $zipPath -Force
          }

          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force

          if (-not (Test-Path $zipPath)) {
            Write-Error "ZIP output missing: expected '$zipPath'"
            exit 1
          }

          Write-Host "Created portable ZIP: $zipPath"
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── SHA256 checksums ──────────────────────────────────────────────────────

      - name: Generate SHA256 checksums
        id: checksums
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $setupExe = "dist/BillingBabaSetup-v$version.exe"
          $zipFile = "apps/client/BillingBaba-Windows-v$version.zip"
          $checksumFile = "dist/SHA256SUMS.txt"

          if (-not (Test-Path $setupExe)) {
            Write-Error "Installer missing for checksum: '$setupExe'"
            exit 1
          }
          if (-not (Test-Path $zipFile)) {
            Write-Error "ZIP missing for checksum: '$zipFile'"
            exit 1
          }

          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash -Path $zipFile -Algorithm SHA256).Hash.ToLower()
          $setupName = Split-Path $setupExe -Leaf
          $zipName = Split-Path $zipFile -Leaf

          @(
            "$setupHash  $setupName"
            "$zipHash  $zipName"
          ) | Set-Content -Path $checksumFile -Encoding utf8

          Write-Host "Generated checksums:"
          Get-Content $checksumFile | ForEach-Object { Write-Host $_ }

          "checksum_file=$checksumFile" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── GitHub Release ────────────────────────────────────────────────────────

      - name: Publish versioned GitHub Release
        if: steps.release.outputs.is_tag_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ${{ steps.release.outputs.release_name }}
          generate_release_notes: true
          files: |
            dist/BillingBabaSetup-v${{ steps.version.outputs.version }}.exe
            apps/client/BillingBaba-Windows-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt

      - name: Publish demo GitHub Release
        if: steps.release.outputs.publish_release == 'true' && steps.release.outputs.is_tag_release != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.release_tag }}
          name: ${{ steps.release.outputs.release_name }}
          prerelease: true
          body: |
            Demo build from commit ${{ github.sha }} on branch `demo`.

            Download **BillingBabaSetup-v${{ steps.version.outputs.version }}.exe** for installation.
          files: |
            dist/BillingBabaSetup-v${{ steps.version.outputs.version }}.exe
            apps/client/BillingBaba-Windows-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt

      # ── GitHub Artifacts ──────────────────────────────────────────────────────

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BillingBaba-Windows-v${{ steps.version.outputs.version }}
          path: |
            dist/BillingBabaSetup-v${{ steps.version.outputs.version }}.exe
            apps/client/BillingBaba-Windows-v${{ steps.version.outputs.version }}.zip
            dist/SHA256SUMS.txt
          retention-days: 30
