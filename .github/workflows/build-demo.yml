# Windows desktop release pipeline for Billing Baba.
#
# Outputs (all under dist/):
#   BillingBabaSetup-v<version>.exe  — Inno Setup installer with VC++ runtime
#   BillingBaba-Windows-v<version>.zip — portable Release folder
#   SHA256SUMS.txt                     — checksums for the above
#
# Triggers:
#   Branch push (demo, develop, main)  → build + publish update (when GitHub vars set) + Artifacts
#   Tag push v*                      → build + publish update + GitHub Release
#   desktop-auto-tag.yml on develop/main pubspec change → force-pushes v* tag (GitHub Release backup)
#   workflow_dispatch            → build + publish update (when vars set) + Artifacts
#
# Re-pushing the same tag updates the existing release; assets with matching names are
# replaced (softprops/action-gh-release overwrite_files, default true).
#
# Future placeholders (not implemented):
#   - Windows Authenticode signing (SignTool / certificate)
#   - MSIX packaging for Microsoft Store distribution
#
# Auto-update: public manifest + installer via publish-update.ps1 when UPDATE_* vars are set.

name: Build Demo

on:
  workflow_dispatch:
    inputs:
      force_update:
        description: "Set force_update in version.json when publishing updates"
        type: boolean
        default: false
      min_supported_build:
        description: "min_supported_build in version.json"
        type: number
        default: 1
  push:
    branches:
      - demo
      - develop
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FLUTTER_WORKING_DIRECTORY: apps/client
  DIST_DIR: dist
  VC_REDIST_URL: https://aka.ms/vs/17/release/vc_redist.x64.exe
  VC_REDIST_CACHE_KEY: vc-redist-x64-v17

jobs:
  build-windows:
    name: Windows Release
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL }}

    defaults:
      run:
        working-directory: ${{ env.FLUTTER_WORKING_DIRECTORY }}

    steps:
      # ── Checkout & version ──────────────────────────────────────────────────────

      - name: Checkout
        uses: actions/checkout@v5

      - name: Read version from pubspec.yaml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:' | Select-Object -First 1
          if (-not $line) {
            Write-Error "Could not find version in pubspec.yaml"
            exit 1
          }
          $version = ($line.Line -replace 'version:\s*', '').Trim().Split('+')[0]
          Write-Host "Application version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare dist output directory
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.DIST_DIR }}" | Out-Null
          Write-Host "Output directory: $(Resolve-Path '${{ env.DIST_DIR }}')"

      - name: Generate Flutter .env
        working-directory: .
        env:
          FLUTTER_ENV_DIR: apps/client
          APP_ENV: ${{ vars.APP_ENV }}
          DEBUG: ${{ vars.DEBUG }}
          ENABLE_DEV_LOGIN: ${{ vars.ENABLE_DEV_LOGIN }}
          DEV_OTP: ${{ vars.DEV_OTP }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          WEBSITE_URL: https://billingbaba.com
          UPDATE_MANIFEST_URL: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/demo' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && vars.UPDATE_MANIFEST_URL || '' }}
          MSG91_WIDGET_ID: ${{ secrets.MSG91_WIDGET_ID }}
          MSG91_WIDGET_AUTH_TOKEN: ${{ secrets.MSG91_WIDGET_AUTH_TOKEN }}
        run: bash .github/scripts/setup-flutter-env.sh

      # ── Flutter build ─────────────────────────────────────────────────────────

      - name: Set up Flutter (stable, with SDK + pub cache)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Clean and fetch dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          $defines = @(
            "--dart-define=API_BASE_URL=$env:API_BASE_URL",
            "--dart-define=WEBSITE_URL=https://billingbaba.com",
            "--dart-define=GIT_COMMIT=${{ github.sha }}"
          )
          $ref = "${{ github.ref }}"
          $bakeManifest = $ref.StartsWith("refs/tags/v") -or $ref -eq "refs/heads/demo" -or $ref -eq "refs/heads/develop" -or $ref -eq "refs/heads/main"
          if ($bakeManifest) {
            $manifestUrl = "${{ vars.UPDATE_MANIFEST_URL }}"
            if ($manifestUrl) {
              $defines += "--dart-define=UPDATE_MANIFEST_URL=$manifestUrl"
            }
          }
          flutter build windows --release @defines

      # ── Verify build output ───────────────────────────────────────────────────

      - name: Verify Windows release build output
        id: build_output
        shell: pwsh
        run: |
          $releaseDir = Join-Path $PWD "build/windows/x64/runner/Release"
          $exePath = Join-Path $releaseDir "billing_baba.exe"

          if (-not (Test-Path $exePath)) {
            Write-Error "Build output missing: expected executable at '$exePath'"
            exit 1
          }

          Write-Host "Verified executable: $exePath"
          "release_dir=$releaseDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # ── VC++ Redistributable ──────────────────────────────────────────────────

      - name: Restore VC++ Redistributable cache
        id: vc_redist_cache
        uses: actions/cache@v4
        with:
          path: installer/deps
          key: ${{ env.VC_REDIST_CACHE_KEY }}

      - name: Download VC++ Redistributable
        if: steps.vc_redist_cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: .
        run: |
          New-Item -ItemType Directory -Force -Path installer/deps | Out-Null
          Invoke-WebRequest -Uri "${{ env.VC_REDIST_URL }}" -OutFile installer/deps/vc_redist.x64.exe

      - name: Verify VC++ Redistributable
        shell: pwsh
        working-directory: .
        run: |
          if (-not (Test-Path installer/deps/vc_redist.x64.exe)) {
            Write-Error "VC++ Redistributable missing at installer/deps/vc_redist.x64.exe"
            exit 1
          }

      # ── Inno Setup installer ──────────────────────────────────────────────────

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup compiler not found at '$iscc'"
            exit 1
          }

      - name: Compile Inno Setup installer
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $releaseDir = "${{ steps.build_output.outputs.release_dir }}"
          $distDir = Join-Path $PWD "${{ env.DIST_DIR }}"
          $setupExe = Join-Path $distDir "BillingBabaSetup-v$version.exe"
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          & $iscc `
            "/DAppVersion=$version" `
            "/DReleaseDir=$releaseDir" `
            "/DOutputDir=$distDir" `
            "/DVCRedistPath=$(Join-Path $PWD 'installer/deps/vc_redist.x64.exe')" `
            "/DSetupIcon=$(Join-Path $PWD 'apps/client/windows/runner/resources/app_icon.ico')" `
            "$(Join-Path $PWD 'installer/BillingBaba.iss')"

          if (-not (Test-Path $setupExe)) {
            Write-Error "Installer output missing: expected '$setupExe'"
            exit 1
          }

          Write-Host "Created installer: $setupExe"

      # ── Portable ZIP package ──────────────────────────────────────────────────

      - name: Package portable Windows ZIP
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $releaseDir = Join-Path $PWD "apps/client/build/windows/x64/runner/Release"
          $zipPath = Join-Path $PWD "${{ env.DIST_DIR }}/BillingBaba-Windows-v$version.zip"

          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }

          # Archive only Release contents (exe, DLLs, data/) — no repo path prefixes.
          Push-Location $releaseDir
          try {
            Compress-Archive -Path * -DestinationPath $zipPath -Force
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $zipPath)) {
            Write-Error "ZIP output missing: expected '$zipPath'"
            exit 1
          }

          Write-Host "Created portable ZIP: $zipPath"

      # ── SHA256 checksums ──────────────────────────────────────────────────────

      - name: Generate SHA256 checksums
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $version = $env:APP_VERSION
          $distDir = "${{ env.DIST_DIR }}"
          $setupName = "BillingBabaSetup-v$version.exe"
          $zipName = "BillingBaba-Windows-v$version.zip"
          $setupExe = Join-Path $distDir $setupName
          $zipFile = Join-Path $distDir $zipName
          $checksumFile = Join-Path $distDir "SHA256SUMS.txt"

          foreach ($file in @($setupExe, $zipFile)) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing file for checksum: '$file'"
              exit 1
            }
          }

          $setupHash = (Get-FileHash -Path $setupExe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash -Path $zipFile -Algorithm SHA256).Hash.ToLower()

          @(
            "$setupHash  $setupName"
            "$zipHash  $zipName"
          ) | Set-Content -Path $checksumFile -Encoding utf8

          Write-Host "Generated checksums:"
          Get-Content $checksumFile | ForEach-Object { Write-Host $_ }

      - name: Generate update manifest
        shell: pwsh
        working-directory: .
        env:
          UPDATE_DOWNLOAD_BASE_URL: ${{ vars.UPDATE_DOWNLOAD_BASE_URL }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update == true && 'true' || 'false' }}
          MIN_SUPPORTED_BUILD: ${{ github.event.inputs.min_supported_build || 1 }}
        run: |
          if (-not $env:UPDATE_DOWNLOAD_BASE_URL) {
            Write-Host "UPDATE_DOWNLOAD_BASE_URL not set — skipping version.json"
            exit 0
          }
          .\.github\scripts\generate-update-manifest.ps1

      - name: Publish update to public hosting
        if: vars.UPDATE_DOWNLOAD_BASE_URL != '' && vars.UPDATE_MANIFEST_URL != ''
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
          UPDATE_S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
          UPDATE_S3_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          UPDATE_S3_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          UPDATE_S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          UPDATE_S3_PATH_PREFIX: ${{ vars.UPDATE_S3_PATH_PREFIX }}
          UPDATE_DOWNLOAD_BASE_URL: ${{ vars.UPDATE_DOWNLOAD_BASE_URL }}
        run: |
          if (-not $env:UPDATE_DOWNLOAD_BASE_URL) {
            Write-Error "UPDATE_DOWNLOAD_BASE_URL is required to publish updates"
          }
          if (-not $env:UPDATE_MANIFEST_URL) {
            Write-Error "UPDATE_MANIFEST_URL is required to publish updates"
          }
          if (-not (Test-Path dist/version.json)) {
            .\.github\scripts\generate-update-manifest.ps1
          }
          .\.github\scripts\publish-update.ps1

      - name: Trigger website redeploy
        if: vars.UPDATE_DOWNLOAD_BASE_URL != '' && vars.UPDATE_MANIFEST_URL != ''
        shell: pwsh
        env:
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WEBSITE_DEPLOY_HOOK_URL)) {
            Write-Host "WEBSITE_DEPLOY_HOOK_URL not set — skipping website redeploy hook"
            exit 0
          }
          try {
            Write-Host "Calling website deploy hook (no URL logged)"
            Invoke-WebRequest -Method POST -Uri $env:WEBSITE_DEPLOY_HOOK_URL -UseBasicParsing | Out-Null
            Write-Host "Website deploy hook invoked."
          } catch {
            $msg = $_.Exception.Message
            if ($msg.Length -gt 200) { $msg = $msg.Substring(0, 200) }
            Write-Warning "::warning::Website deploy hook skipped: $msg"
          }

      - name: Prune old update installers
        if: vars.UPDATE_DOWNLOAD_BASE_URL != '' && vars.UPDATE_MANIFEST_URL != ''
        shell: pwsh
        working-directory: .
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          UPDATE_MANIFEST_URL: ${{ vars.UPDATE_MANIFEST_URL }}
          UPDATE_S3_BUCKET: ${{ secrets.UPDATE_S3_BUCKET }}
          UPDATE_S3_ACCESS_KEY_ID: ${{ secrets.UPDATE_S3_ACCESS_KEY_ID }}
          UPDATE_S3_SECRET_ACCESS_KEY: ${{ secrets.UPDATE_S3_SECRET_ACCESS_KEY }}
          UPDATE_S3_ENDPOINT: ${{ secrets.UPDATE_S3_ENDPOINT }}
          UPDATE_S3_PATH_PREFIX: ${{ vars.UPDATE_S3_PATH_PREFIX }}
          UPDATE_DOWNLOAD_BASE_URL: ${{ vars.UPDATE_DOWNLOAD_BASE_URL }}
        run: |
          .\.github\scripts\publish-update.ps1 -PruneOnly

      # ── GitHub Release (tag v* only) ──────────────────────────────────────────

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Billing Baba v${{ steps.version.outputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: ${{ env.DIST_DIR }}/*

      # ── GitHub Artifacts ──────────────────────────────────────────────────────

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BillingBaba-Windows-v${{ steps.version.outputs.version }}
          path: ${{ env.DIST_DIR }}/
          retention-days: 30
