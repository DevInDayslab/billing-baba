# Backend CI for Billing Baba API.
# Runs on pull requests and pushes targeting `develop`.
#
# Pipeline: install → typecheck → lint → build → test (unit + integration + smoke)
# PostgreSQL service container provides an isolated database for integration tests.

name: Backend CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

env:
  APP_NAME: Billing Baba API
  NODE_ENV: test
  HOST: 0.0.0.0
  PORT: 3000
  API_PREFIX: /api/v1
  LOG_LEVEL: error
  DATABASE_URL: postgres://billing:billing@localhost:5432/billing_test
  JWT_SECRET: ci-test-jwt-secret-minimum-32-characters
  JWT_REFRESH_SECRET: ci-test-refresh-secret-minimum-32-characters
  ENABLE_DEV_LOGIN: true

jobs:
  ci:
    name: Lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
          cache-dependency-path: apps/api/bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun run db:migrate

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Test
        run: bun test tests
